<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Voice Emotion Recognition</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
	<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
	<main class="container py-5">
        <div class="row justify-content-center text-center">
            <h1 class="h3 fw-semibold mb-3">Voice Emotion Recognition</h1>
		    <p class="text-body-secondary mb-4">Record a short audio clip and see if an AI model can recognize emotions in your voice.</p>
			<div class="col-12 col-md-8 col-lg-6">
				<section class="card shadow-sm">
					<div class="card-body p-4 p-md-5">
						<div class="d-flex flex-column gap-2 align-items-center mb-3">
							<button id="record-button" type="button" class="btn btn-secondary record-toggle-button" aria-label="Start recording" title="Start recording">
								<span class="record-icon" aria-hidden="true"></span>
								<span class="pause-icon" aria-hidden="true"></span>
							</button>
							<p id="status-text" class="mb-0 fw-semibold text-uppercase small text-body-secondary">Press to start recording</p>
						</div>
						<p id="error-text" class="alert alert-danger mb-0 py-2 px-3 d-none" aria-live="assertive"></p>
						<div class="mt-3 d-none" id="playback-container">
							<audio id="recording-playback" class="w-100" controls></audio>
						</div>
					</div>
				</section>

				<section class="card shadow-sm mt-4" id="inference-container">
					<div class="card-body p-4 p-md-5">
						<h2 class="h5 fw-semibold mb-3">Inference</h2>
						<div class="row g-3 align-items-end">
							<div class="col-12 col-md-8">
								<select id="model-select" class="form-select" name="model-select">
                                    <option value="" disabled selected>Select a model</option>
                                </select>
							</div>
							<div class="col-12 col-md-4 d-grid">
								<button id="infer-button" type="button" class="btn btn-secondary" disabled>Evaluate</button>
							</div>
						</div>
						<p id="inference-text" class="mt-3 mb-0 text-body-secondary">Record audio first to enable inference.</p>
					</div>
				</section>
			</div>
		</div>
	</main>

	<script type="module" src="script.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
