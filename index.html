<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Voice Emotion Recognition</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
	<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-12 col-md-8 col-lg-6">
				<section class="card shadow-sm">
					<div class="card-body p-4 p-md-5">
						<h1 class="h3 fw-semibold mb-3">Voice Emotion Recognition</h1>
						<p class="text-body-secondary mb-4">Record a short audio clip and see if an AI model can recognize emotions in your voice.</p>
						<div class="d-flex gap-2 flex-wrap mb-3">
							<button id="record-button" type="button" class="btn btn-primary">Record</button>
							<button id="stop-button" type="button" class="btn btn-outline-secondary" disabled>Stop</button>
						</div>

						<p id="status-text" class="mb-2 fw-semibold text-uppercase small text-body-secondary">idle</p>
						<p id="error-text" class="alert alert-danger mb-0 py-2 px-3" aria-live="assertive"></p>
						<div class="mt-3">
							<label for="recording-playback" class="form-label">Last recording</label>
							<audio id="recording-playback" class="w-100" controls></audio>
						</div>
					</div>
				</section>
			</div>
		</div>
	</main>

	<script type="module" src="script.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
